name: Python tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check syntax
        run: python -m compileall -q src tests
      - name: Run tests (synthetic files only)
        run: python -m unittest discover -s tests -v
